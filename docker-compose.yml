version: '3.8'

services:
  api:
    build: .
    container_name: contextiq_api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ContextIQ — Enterprise Semantic Context Engine
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=esce_db
      - POSTGRES_USER=esce_user
      - POSTGRES_PASSWORD=esce_password
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=esce_neo4j_password
      - GEMINI_MODEL=gemini-2.0-flash
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: contextiq_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=esce_db
      - POSTGRES_USER=esce_user
      - POSTGRES_PASSWORD=esce_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esce_user -d esce_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.18.0-community
    container_name: contextiq_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/esce_neo4j_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "esce_neo4j_password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
